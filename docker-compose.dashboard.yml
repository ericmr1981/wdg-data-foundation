services:
  postgres:
    image: postgres:16
    container_name: dataplatform-pg-dashboard
    environment:
      POSTGRES_DB: ${DB_NAME:-dataplatform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dataplatform_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  ui:
    image: ${UI_IMAGE:-wdg-data-foundation-ui:latest}
    build:
      context: ./ui
    container_name: dataplatform-ui
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dataplatform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SCRIPTS_DIR: /scripts
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - ./scripts:/scripts
      - ../sql:/sql
    ports:
      - "${UI_PORT:-3002}:3000"
    restart: unless-stopped

networks:
  default:
    name: wdg-data-foundation_default

volumes:
  dataplatform_pg_data:
