name: Build and Push UI + Agent to ACR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js (UI)
        id: setup-node-ui
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Set up Node.js (Agent)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agent/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install UI dependencies
        run: cd ui && npm ci

      - name: Install Python dependencies
        run: pip install psycopg2-binary pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tags
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "ts=$(date +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build and push agent image
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/agent:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/agent:${{ steps.meta.outputs.short_sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/agent:${{ steps.meta.outputs.ts }}

      - name: Build and push ui image
        uses: docker/build-push-action@v6
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ui:latest
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ui:${{ steps.meta.outputs.short_sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ui:${{ steps.meta.outputs.ts }}

      - name: Notify VPS to pull
        run: |
          echo ">>> agent image pushed: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/agent:${{ steps.meta.outputs.short_sha }}"
          echo ">>> ui image pushed: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/ui:${{ steps.meta.outputs.short_sha }}"
          echo ">>> VPS cron will pull and restart within 5 minutes"
