name: Deploy to VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/wdg-data-foundation
            git stash
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ericmr1981/wdg-data-foundation.git
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin git@github.com:ericmr1981/wdg-data-foundation.git
            docker network create wdg-data-foundation_default 2>/dev/null || true
            docker stop dataplatform-ui 2>/dev/null || true
            docker rm dataplatform-ui 2>/dev/null || true
            docker stop dataplatform-pg-dashboard 2>/dev/null || true
            docker rm dataplatform-pg-dashboard 2>/dev/null || true
            docker-compose -f docker-compose.dashboard.yml up -d --build 2>&1 || true
            sleep 8
            # Reset admin password
            docker-compose -f docker-compose.dashboard.yml exec -T postgres psql -U postgres -d dataplatform -c "UPDATE ops.users SET password_hash = crypt('Souledge1981', gen_salt('bf')) WHERE username = 'admin';" 2>&1 || true
