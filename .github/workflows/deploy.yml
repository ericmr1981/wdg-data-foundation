name: Deploy to VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.6+ required for --experimental-strip-types used in chat unit tests
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI dependencies
        run: cd ui && npm ci
      - name: Install Python dependencies
        run: pip install psycopg2-binary pytest
      - name: Run verify-chat-agent.sh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bash scripts/verify-chat-agent.sh
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/wdg-data-foundation
            git stash
            git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/ericmr1981/wdg-data-foundation.git
            git fetch origin main
            git reset --hard origin/main
            git remote set-url origin git@github.com:ericmr1981/wdg-data-foundation.git
            docker network create wdg-data-foundation_default 2>/dev/null || true

            # Clean up old metabase container (no longer in use)
            docker stop dataplatform-metabase 2>/dev/null || true
            docker rm dataplatform-metabase 2>/dev/null || true
            docker volume rm metabase_data 2>/dev/null || true

            # Remove stale xlsx files that ended up in scripts/ directory
            rm -f scripts/溫萬*.xlsx

            # Postgres is managed separately as a standalone container.
            # Only rebuild and restart the UI.
            docker stop dataplatform-ui 2>/dev/null || true
            docker rm dataplatform-ui 2>/dev/null || true
            docker-compose -f docker-compose.dashboard.yml up -d --no-deps --build ui 2>&1 || true
