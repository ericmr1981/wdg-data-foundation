name: Deploy to VPS
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/wdg-data-foundation
            git stash
            git pull origin main
            docker network create wdg-data-foundation_default 2>/dev/null || true
            docker stop dataplatform-ui 2>/dev/null || true
            docker rm dataplatform-ui 2>/dev/null || true
            docker-compose -f docker-compose.dashboard.yml up -d --no-deps --build ui
