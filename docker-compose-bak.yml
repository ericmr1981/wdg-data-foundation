# WDG Data Foundation — 本地 dev 编排
#
# ⚠️ DEV-ONLY FILE — DO NOT PUSH TO origin/main
# This file is local dev infra. It was inadvertently deleted when main
# diverged from the 6 dev infra commits (370397b / 699cf64 / etc).
# Restore reference: git show 370397b:docker-compose.yml
#
# ─────────────────────────────────────────────────────────────────────
# 共享容器 / Multi-project co-tenant (READ FIRST)
# ─────────────────────────────────────────────────────────────────────
# 这个 compose 不只跑 wdg-data-foundation, 还把另外 2 个独立项目
# 一起 bind mount 进同一个 wdg-systemd 容器:
#
#   ┌─────────────────┬──────────────────────────┬────────────────────┐
#   │ 项目             │ host 路径                │ 容器内路径          │
#   ├─────────────────┼──────────────────────────┼────────────────────┤
#   │ wdg-data-found. │ ~/GitHub/wdg-data-found. │ /opt/wdg           │
#   │ WGD_Portal      │ ~/GitHub/WGD_Portal      │ /opt/wdg/portal    │
#   │ DailyCheck      │ ~/GitHub/DailyCheck      │ /opt/dailycheck    │
#   └─────────────────┴──────────────────────────┴────────────────────┘
#
# **后果**:
#   1. WGD_Portal / DailyCheck 没有自己的 docker-compose.yml,
#      它们的代码完全靠本文件 bind mount 进 wdg-systemd。
#      删了本文件 → 这两个项目没法在容器里跑了。
#   2. 这两个项目的改动通过 bind mount 实时进入容器 (无 HMR
#      boundary), 撤销改动 (`git checkout`) 立即影响容器内版本。
#   3. 端口分配 / volume 命名空间都在本文件里 — 改端口时三个项目
#      互相影响 (谁先 docker compose up 谁占端口)。
#
# **Owner map** (谁依赖哪个 mount):
#   - WGD_Portal:  ../WGD_Portal  -> /opt/wdg/portal (read_only)
#                  + 命名 volume portal_node_modules / portal_next_cache
#   - DailyCheck:  ../DailyCheck  -> /opt/dailycheck
#                  (由本文件维护, DailyCheck repo 本身无 docker-compose)
#   - wdg-data-found.: . -> /opt/wdg
# ─────────────────────────────────────────────────────────────────────
#
# 架构 (与生产 1:1 对齐):
#   - systemd 容器跑业务进程 (UI / Agent / WS-Proxy / Scheduler)
#     由 systemd 编排, 跟生产 deploy/systemd/wdg-*.service 同名
#   - PostgreSQL 跑在标准 docker 容器 (postgres:16-alpine), 不绑进 systemd
#     这跟生产 systemd 内 apt 装 PG 有差异, 但开发体验更标准
#
# 数据持久化:
#   - postgres-main / postgres-agent: docker volume (pgdata-main / pgdata-agent)
#   - systemd-stack: bind mount 仓库到 /opt/wdg + 其它两项目
#
# 端口 (与生产 systemd unit 一致):
#   postgres-main      5432 → 5432
#   postgres-agent     5433 → 5433
#   wdg-ui             3001 → 3001
#   wdg-portal         3002 → 3002  (WGD_Portal Pages Router, dev mode)
#   wdg-agent          4101 → 4101
#   wdg-ws-proxy       4102 → 4102 (本地改 4102 防冲突, 生产 3000)
#
# 前置 (首次跑前手动执行一次):
#   mkdir -p .etc/wdg                # host 端 env 文件目录
#   docker volume create wdg_portal_node_modules
#   docker volume create wdg_portal_next_cache
#   docker volume create wdg_pgdata_main
#   docker volume create wdg_agent_pgdata    # 或复用已有
#
# 启动:
#   docker compose up -d              # 起 PG + systemd 容器
#   docker compose exec systemd-stack bash
#   # 容器内:
#   systemctl status wdg.target
#   bash scripts/verify_systemd.sh
#
# 销毁:
#   docker compose down               # 容器删除, 数据卷保留
#   docker compose down -v            # 容器 + 数据卷都删

services:
  postgres-main:
    image: postgres:16-alpine
    container_name: wdg-postgres-main
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: dataplatform
    ports:
      - "5432:5432"
    volumes:
      - pgdata-main:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dataplatform"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wdg-net

  postgres-agent:
    image: postgres:16-alpine
    container_name: wdg-postgres-agent
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${POSTGRES_AGENT_PASSWORD:-local-dev-only}
      POSTGRES_DB: agent_dev
    ports:
      - "5433:5432"
    volumes:
      # 复用老 docker volume (wdg_agent_pgdata) — 如果是全新环境, 用 docker volume create 建
      - wdg_agent_pgdata:/var/lib/postgresql/data
      # 首次启动时自动跑 agent schema (idempotent)
      - ./sql/00_agent_schema.sql:/docker-entrypoint-initdb.d/00_agent_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wdg-net

  systemd-stack:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
    container_name: wdg-systemd
    restart: unless-stopped
    privileged: true   # systemd / cgroup 要求 (macOS Docker Desktop 不需要 pid:host / cgroup:host, 反而会冲突)
    command: ["/sbin/init"]
    ports:
      - "3001:3001"   # wdg-ui
      - "3002:3002"   # wdg-portal (WGD_Portal, Pages Router)
      - "4101:4101"   # wdg-agent
      - "4102:4102"   # wdg-ws-proxy (本地改 4102, 生产 3000)
    volumes:
      # 仓库 bind mount 到容器内 /opt/wdg (跟生产路径一致)
      - .:/opt/wdg
      # WGD Portal (Pages Router) — 代码只读, node_modules 和 .next 用命名 volume 分离
      - type: bind
        source: ../WGD_Portal
        target: /opt/wdg/portal
        read_only: true
      - portal_node_modules:/opt/wdg/portal/node_modules
      - portal_next_cache:/opt/wdg/portal/.next
      # DailyCheck (独立项目, 没有自己的 docker-compose; 靠本文件挂入)
      - type: bind
        source: ../DailyCheck
        target: /opt/dailycheck
        read_only: true
      # env 文件目录, install_systemd.sh 会自动写
      - .etc/wdg:/etc/wdg
      # cgroup 树 (privileged 已给全部权限, 显式挂载方便调试)
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    environment:
      # 在容器内, PG 通过 docker network 的 service name 访问 (而不是 localhost)
      # 业务进程在容器内, 但 .env 里的 DB_HOST=localhost 仍然是 host 上 psql 等工具用的
      DB_HOST_PG_MAIN: postgres-main
      DB_HOST_PG_AGENT: postgres-agent
      DB_PORT_MAIN: 5432
      DB_PORT_AGENT: 5432     # 容器内都是 5432 (host 端口映射在外面)
      DB_NAME_MAIN: dataplatform
      DB_NAME_AGENT: agent_dev
    depends_on:
      postgres-main:
        condition: service_healthy
      postgres-agent:
        condition: service_healthy
    networks:
      - wdg-net

volumes:
  pgdata-main:
    name: wdg_pgdata_main
  # 复用老 docker volume, 数据已经在里面 (你之前 docker volume 上的 agent_dev)
  wdg_agent_pgdata:
    external: true
    name: wdg_agent_pgdata
  portal_node_modules:
    name: wdg_portal_node_modules
  portal_next_cache:
    name: wdg_portal_next_cache

networks:
  wdg-net:
    name: wdg-dev
    driver: bridge