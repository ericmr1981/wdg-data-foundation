services:
  postgres:
    image: postgres:16
    container_name: dataplatform-pg-dashboard
    environment:
      POSTGRES_DB: ${DB_NAME:-dataplatform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dataplatform_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    container_name: dataplatform-ui
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dataplatform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${UI_PORT:-3002}:3000"
    restart: unless-stopped

volumes:
  dataplatform_pg_data:
