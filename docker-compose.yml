services:
  postgres:
    image: postgres:16
    container_name: dataplatform-pg-dashboard
    environment:
      POSTGRES_DB: ${DB_NAME:-dataplatform}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - dataplatform_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dataplatform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ui:
    build:
      context: ./ui
    container_name: dataplatform-ui
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dataplatform}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      AGENT_INTERNAL_URL: http://agent:4101
      NEXT_PUBLIC_AGENT_WS_URL: ws://agent:4102/ws
      NEXT_PUBLIC_AGENT_ROLLOUT_PERCENT: ${NEXT_PUBLIC_AGENT_ROLLOUT_PERCENT:-10}
    ports:
      - "${UI_PORT:-3002}:3000"
    restart: unless-stopped

  agent:
    build: ./agent
    container_name: wdg-agent
    environment:
      - WS_PORT=4101
      - DATABASE_URL=postgresql://agent:local-dev-only@agent-test-db:5432/agent_dev
      - MCP_ENDPOINT=http://ui:3000/api/mcp
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-8}
      - CRON_TIMEZONE=Asia/Shanghai
      - CRON_WEEKLY_REVIEW=0 9 * * 1
      - TASK_WORKER_COUNT=4
      - LOG_LEVEL=info
    depends_on:
      agent-test-db:
        condition: service_healthy
      ui:
        condition: service_started
    volumes:
      - ./agent/skills:/app/skills
      - ./agent/agent.md:/app/agent.md:ro
    ports:
      - "4101:4101"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:4101/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── 隔离本地 test DB ─────────────────────────────────
  # 本地预览专用: agent 服务的独立 Postgres, 5433 端口, 跟 production DB 完全隔离
  # 用 ./sql/00_agent_schema.sql 做 initdb, 用 scripts/seed-mock-data.sql 灌 mock 数据
  agent-test-db:
    image: postgres:16-alpine
    container_name: wdg-agent-test-db
    environment:
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=local-dev-only
      - POSTGRES_DB=agent_dev
    volumes:
      - agent-test-db-data:/var/lib/postgresql/data
      - ./sql/00_agent_schema.sql:/docker-entrypoint-initdb.d/00_agent_schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  dataplatform_pg_data:
  agent-test-db-data:
